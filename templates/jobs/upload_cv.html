
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Job Assistant | CV Yükle</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(ellipse at 15% 20%, #7c83ff 0%, transparent 45%),
                radial-gradient(ellipse at 85% 75%, #b18cff 0%, transparent 45%),
                linear-gradient(135deg, #111a3b, #263c75, #30245c);
            color: white;
        }

        .card {
            width: 100%;
            max-width: 480px;
            padding: 38px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
        }

        .brand {
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #d8d8ff;
            text-transform: uppercase;
        }

        h1 {
            text-align: center;
            font-size: 29px;
            margin: 18px 0 10px;
        }

        .subtitle {
            text-align: center;
            color: #e0e4ff;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        form p {
            margin-bottom: 20px;
        }

        form label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            color: #f0f1ff;
        }

        form input,
        form select {
            width: 100%;
            padding: 13px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.94);
            color: #202747;
            font-size: 15px;
        }

        form input[type="file"] {
            padding: 12px;
        }

        form input:focus,
        form select:focus {
            outline: 2px solid #c2b8ff;
            border-color: transparent;
        }

        .helptext {
            display: block;
            margin-top: 8px;
            color: #e0e4ff;
            font-size: 12px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #c3b6ff, #ffffff);
            color: #22264e;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .back-link {
            display: block;
            margin-top: 24px;
            text-align: center;
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .card {
                padding: 28px 22px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="brand">AI Job Assistant</div>

        <h1>CV'ni Yükle</h1>
        <p class="subtitle">
            CV'ni ekle, sana uygun kariyer fırsatlarını keşfetmeye hazırlan.
        </p>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}

            <button class="submit-btn" type="submit">
                CV'yi Yükle
            </button>
        </form>

        <a class="back-link" href="{% url 'job_list' %}">
            ← İş ilanlarına geri dön
        </a>
    </main>
</body>
</html>
